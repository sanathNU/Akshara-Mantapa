name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          version=0.12.1
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/wasm-pack"
          mkdir -p "$install_dir" "$HOME/.cargo/bin"
          curl --fail --location --retry 3 \
            "https://github.com/rustwasm/wasm-pack/releases/download/v${version}/${archive}" \
            --output "$install_dir/$archive"
          tar -xzf "$install_dir/$archive" -C "$install_dir"
          install -m 0755 "$install_dir/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/wasm-pack" --version

      - name: Build WASM
        run: |
          cd backend
          wasm-pack build --target web --features wasm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Copy WASM to frontend
        run: |
          mkdir -p frontend/src/lib/wasm
          cp backend/pkg/akshara_mantapa_bg.wasm frontend/src/lib/wasm/
          cp backend/pkg/akshara_mantapa.js frontend/src/lib/wasm/
          cp backend/pkg/akshara_mantapa.d.ts frontend/src/lib/wasm/

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
